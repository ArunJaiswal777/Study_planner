<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - AI Study Planner</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='saas-theme.css') }}">
</head>

<body>

  <div class="auth-container">
    <div class="card auth-card glass-card">
      <div class="text-center" style="margin-bottom: 2rem;">
        <h1 class="logo-text">AI Study Planner</h1>
        <p class="text-muted text-sm" style="margin-top: 0.5rem;">Welcome back! Please login to continue.</p>
      </div>

      <!-- Flash Messages -->
      {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
      {% for category, message in messages %}
      <div class="{{ 'alert-error' if category == 'error' else 'alert-success' }}">
        {{ message }}
      </div>
      {% endfor %}
      {% endif %}
      {% endwith %}

      <form method="POST" action="{{ url_for('login') }}">
        <div class="form-group">
          <label for="username" class="form-label">Username</label>
          <input type="text" id="username" name="username" class="form-input" placeholder="Enter your username"
            required>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required>
        </div>

        <div style="margin-top: 1.5rem;">
          <button type="submit" class="btn btn-primary btn-full">Sign In</button>
        </div>
      </form>

      <div class="text-center" style="margin-top: 1.5rem;">
        <p class="text-sm text-muted">
          Don't have an account?
          <a href="{{ url_for('register') }}" class="font-medium">Create account</a>
        </p>
      </div>
    </div>
  </div>

</body>

</html>
